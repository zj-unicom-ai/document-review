[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "document-review"
version = "0.1.0"
description = "通用文档智能审查平台 - backend"
requires-python = ">=3.12"
readme = "README.md"
authors = [{ name = "document-review team" }]
license = { text = "MIT" }

dependencies = [
  "document-review-core==0.2.0",
  # Web framework
  "fastapi>=0.110",
  "uvicorn[standard]>=0.27",
  "python-multipart>=0.0.9",
  # Config & validation
  "pydantic>=2.6",
  "pydantic-settings>=2.2",
  # Database (async)
  "sqlalchemy[asyncio]>=2.0.27",
  "alembic>=1.13",
  "aiomysql>=0.2.0",
  "PyMySQL[rsa]>=1.1",
  "aiosqlite>=0.20",
  # Cache / queue / semaphore
  "redis>=5.0",
  # LangGraph orchestration
  "langgraph>=1.0",
  "langchain-core>=1.0",
  "langchain-openai>=1.0",
  "jsonschema>=4.21",
  # PDF & image
  "PyMuPDF>=1.24",
  "Pillow>=10.0",
  # Observability / utility
  "structlog>=24.1",
  "tenacity>=8.2",
  "httpx>=0.27",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "pytest-asyncio>=0.23",
  "pytest-cov>=4.1",
  "anyio>=4.3",
]
lint = ["ruff>=0.4"]

[project.scripts]
document-review = "app.cli:main"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
python_files = ["test_*.py"]
filterwarnings = ["ignore::DeprecationWarning"]
addopts = "-ra --strict-markers"
markers = ["integration: marks integration tests (require db)"]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = [".venv", "build", "dist", "alembic/versions"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "ASYNC", "SIM", "RUF"]
# RUF001/RUF002/RUF003：项目约定 docstring/字符串/注释使用中文全角标点，告警是误报，全局豁免。
# UP046：`Generic[T]` 子类化写法在 Python 3.12 仍合法且与 BaseModel 配合更直白，不强制 PEP 695 风格。
# E501：行长限制；B008：默认参数中函数调用，框架层常见，按需豁免。
ignore = ["E501", "B008", "RUF001", "RUF002", "RUF003", "UP046"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["B", "SIM"]
"packages/core/tests/**" = ["B", "SIM"]
"alembic/**" = ["E", "F", "B", "UP"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.coverage.run]
source = ["app"]
omit = ["*/tests/*", "*/migrations/*"]
